# Grafana dashboard-provider config (VOIP-1336). Auto-loaded on container
# startup from /etc/grafana/provisioning/dashboards - points Grafana at the
# JSON dashboards bind-mounted at /var/lib/grafana/dashboards (see
# docker-compose.yml.dist's grafana service volumes).
apiVersion: 1

providers:
  - name: VoIPBin
    orgId: 1
    folder: VoIPBin
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
