# Prometheus scrape configuration for the VoIPBin sandbox/production stack
# (VOIP-1336). Mounted read-only into the prometheus container at
# /etc/prometheus/prometheus.yml (see docker-compose.yml.dist).
#
# All targets below are compose-network-internal service names/ports - none
# of these exporters are published to the host, only prometheus itself
# (127.0.0.1:9090) and grafana (127.0.0.1:3000) are, per the SSH-tunnel
# access pattern documented in README.md "Monitoring (Prometheus/Grafana)".

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertmanager (VOIP-1338) - see the alertmanager service in
# docker-compose.yml.dist and config/alertmanager/alertmanager.yml.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# Alert rule definitions - see config/prometheus/alert-rules.yml for the
# full set and its header comment for what was/wasn't ported from
# monorepo-etc/infra-prometheus's GKE alert rules and why.
rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  # Prometheus's own metrics.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Host-level metrics (CPU, memory, disk, network) - see node-exporter
  # service in docker-compose.yml.dist.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Per-container metrics (CPU, memory, network, disk) - see cadvisor
  # service in docker-compose.yml.dist.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # RabbitMQ's built-in Prometheus plugin (rabbitmq_prometheus, enabled in
  # the rabbitmq service's entrypoint in docker-compose.yml.dist).
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  # redis_exporter sidecar - see redis-exporter service in
  # docker-compose.yml.dist.
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  # mysqld_exporter sidecar - see mysqld-exporter service in
  # docker-compose.yml.dist.
  - job_name: mysql
    static_configs:
      - targets: ["mysqld-exporter:9104"]

  # RTPEngine's built-in HTTP metrics endpoint (VOIP-1338). RTPEngine runs
  # network_mode: host (see docker-compose.yml.dist), so its
  # RTPENGINE_LISTEN_HTTP port is bound on the HOST's own network namespace,
  # not reachable at a compose service name. prometheus itself is on the
  # default bridge network, so it reaches the host via host.docker.internal
  # (extra_hosts: host-gateway, see the prometheus service in
  # docker-compose.yml.dist) rather than 127.0.0.1. Port is hardcoded to
  # 9101 (RTPENGINE_LISTEN_HTTP's default in .env.template/docker-compose.yml.dist) -
  # this file is a static YAML mount, not docker-compose-interpolated, so
  # ${VAR} substitution does not work here. If you override
  # RTPENGINE_LISTEN_HTTP in .env, update this target to match.
  - job_name: rtpengine
    static_configs:
      - targets: ["host.docker.internal:9101"]

  # kamailio_exporter sidecar (VOIP-1338) - see the kamailio-exporter
  # service in docker-compose.yml.dist for the full port-collision
  # explanation (9105, not RTPEngine's 9101). Same host.docker.internal
  # reasoning as the rtpengine job above: network_mode: host, unreachable
  # by compose service name from prometheus's bridge-network container.
  - job_name: kamailio
    static_configs:
      - targets: ["host.docker.internal:9105"]

  # VoIPBin manager services - every bin-*-manager in docker-compose.yml.dist
  # already exposes Prometheus metrics on :2112/metrics natively (see
  # install/CLAUDE.md "Manager Services": "Expose Prometheus metrics on
  # :2112/metrics") - no exporter sidecar needed, just a static target list.
  # Kept as one job (not split per-service) since they share the same
  # port/path convention; "VoIPBin - Manager Services" dashboard in
  # config/grafana/dashboards/ labels panels by the `instance` (= target)
  # label. Update this list when a new bin-*-manager is added to
  # docker-compose.yml.dist.
  - job_name: voipbin-managers
    metrics_path: /metrics
    static_configs:
      - targets:
          - agent-manager:2112
          - ai-manager:2112
          - api-manager:2112
          - billing-manager:2112
          - call-manager:2112
          - campaign-manager:2112
          - contact-manager:2112
          - conference-manager:2112
          - conversation-manager:2112
          - customer-manager:2112
          - direct-manager:2112
          - email-manager:2112
          - flow-manager:2112
          - hook-manager:2112
          - message-manager:2112
          - number-manager:2112
          - outdial-manager:2112
          - pipecat-manager:2112
          - queue-manager:2112
          - rag-manager:2112
          - registrar-manager:2112
          - route-manager:2112
          - schedule-manager:2112
          - storage-manager:2112
          - tag-manager:2112
          - talk-manager:2112
          - timeline-manager:2112
          - transcribe-manager:2112
          - transfer-manager:2112
          - tts-manager:2112
          - webchat-manager:2112
          - webhook-manager:2112

  # Asterisk res_prometheus (VOIP-1336 follow-up, see docs/follow-ups.md):
  # the voip-asterisk-call/-conference/-registrar images pulled by this
  # stack do not currently enable/expose res_prometheus, so there is no
  # reachable target to scrape here yet. Uncomment once that image change
  # lands upstream (monorepo-voip) and a port is published on the compose
  # network for each of the three asterisk-* services.
  # - job_name: asterisk
  #   static_configs:
  #     - targets: ["asterisk-call:8088", "asterisk-conference:8088", "asterisk-registrar:8088"]
  #   metrics_path: /metrics
