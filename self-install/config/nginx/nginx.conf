worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# NOTE: This config file is NOT currently wired to any docker-compose.yml
# service (no `nginx` service exists in compose) — confirmed pre-existing
# before this branch, not introduced by it. It was updated here (service-name
# DNS instead of removed 10.100.0.x literals) for consistency with the rest
# of the address-externalization change, in case it's adopted as an
# ingress/reverse-proxy option in a later phase. Left in place rather than
# deleted since removing/wiring it is out of scope for Phase 1.

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Upstream definitions (service-name DNS; static IPs removed in Phase 1
    # of the horizontal-scale-architecture design — see docs/plans/2026-07-05)
    upstream api-manager {
        server api-manager:443;
    }

    upstream admin-console {
        server square-admin:80;
    }

    upstream meet-app {
        server square-meet:80;
    }

    upstream talk-app {
        server square-talk:80;
    }

    # HTTP - redirect to HTTPS for API, serve others directly
    server {
        listen 80;
        server_name api.voipbin.test;
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 80;
        server_name admin.voipbin.test;

        location / {
            proxy_pass http://admin-console;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    server {
        listen 80;
        server_name meet.voipbin.test;

        location / {
            proxy_pass http://meet-app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    server {
        listen 80;
        server_name talk.voipbin.test;

        location / {
            proxy_pass http://talk-app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # HTTPS - API Manager
    server {
        listen 443 ssl;
        server_name api.voipbin.test;

        ssl_certificate /certs/api/cert.pem;
        ssl_certificate_key /certs/api/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass https://api-manager;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_ssl_verify off;
        }
    }

    # HTTPS - Admin Console
    server {
        listen 443 ssl;
        server_name admin.voipbin.test;

        ssl_certificate /certs/api/cert.pem;
        ssl_certificate_key /certs/api/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://admin-console;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # HTTPS - Meet
    server {
        listen 443 ssl;
        server_name meet.voipbin.test;

        ssl_certificate /certs/api/cert.pem;
        ssl_certificate_key /certs/api/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://meet-app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # HTTPS - Talk
    server {
        listen 443 ssl;
        server_name talk.voipbin.test;

        ssl_certificate /certs/api/cert.pem;
        ssl_certificate_key /certs/api/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://talk-app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
